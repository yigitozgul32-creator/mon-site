<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images | Site FiveM</title> <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #240046 0%, #10002b 50%, #050014 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* GTA VI Neon Arka Plan Işıkları */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: #ff007f;
            filter: blur(150px);
            opacity: 0.35;
            top: 10%;
            left: 10%;
            border-radius: 50%;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: #00f0ff;
            filter: blur(150px);
            opacity: 0.25;
            bottom: 10%;
            right: 10%;
            border-radius: 50%;
        }

        /* Cam Efektli Ana Kart */
        .container {
            background: rgba(15, 5, 29, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 0, 128, 0.3);
            border-radius: 20px;
            padding: 35px;
            max-width: 700px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 0, 128, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        .top-bar {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 15px;
        }

        .btn-back {
            background: linear-gradient(45deg, #0070f3, #00dfd8);
            color: #ffffff;
            padding: 10px 22px;
            font-weight: 900;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 223, 216, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-back:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 25px rgba(0, 223, 216, 0.8);
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff007f, #ff75c3, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 0, 128, 0.5);
            margin: 10px 0;
        }

        .neon-hr {
            height: 2px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #ff007f, #00f0ff, transparent);
            border: none;
            margin: 20px 0;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .image-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            display: block;
        }

        .image-card:hover {
            transform: scale(1.02);
            border-color: #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.6);
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }

        .image-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(15, 5, 29, 0.95));
            padding: 12px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bouton de retour à la page d'accueil -->
        <div class="top-bar">
            <a href="index.html" class="btn-back">
                &larr; SITE FIVEM
            </a>
        </div>

        <hr class="neon-hr">
        <h1>IMAGES & GRAPHISMES</h1>
        <hr class="neon-hr">

        <div class="gallery">
            <!-- 1. Görsel (Landscape) -->
            <a href="https://youtu.be/YpQaJbnIM-A?si=PwkJ1m85brtvbEtt" target="_blank" class="image-card">
                <img src="image/landscape.png" alt="PACK GRAPHIQUE" title="pack graphique">
                <div class="image-title">PACK GRAPHIQUE</div>
            </a>

            <hr class="neon-hr">

            <!-- 2. Görsel (FiveM) -->
            <a href="https://youtu.be/YpQaJbnIM-A?si=PwkJ1m85brtvbEtt" target="_blank" class="image-card">
                <img src="image/fivem.png" alt="Image FiveM">
                <div class="image-title">IMAGE FIVEM</div>
            </a>
        </div>

        <hr class="neon-hr">
    </div>

</body>
</html>
